<app-header></app-header>

<!-- Upload area (existing) -->
<div *ngIf="isinputgiven()">
  <form>
    <div class="upload-container">
      <div class="upload-box">
        <div class="plus-icon">+</div>
        <label class="upload-label">Drag and drop the<br />Legal document</label>
        <input type="file"
               #fileinput
               accept=".pdf, .txt, .doc, .docx"
               class="file-input"
               (change)="onfileselect(fileinput)" />
      </div>
    </div>
  </form>
</div>

<!-- Loader overlay -->
<div *ngIf="isloading()" class="loader-overlay">
  <span class="loader"></span>
</div>

<!-- Charts row (unchanged) -->
<div *ngIf="showvisualization()" class="charts-flex-row">
  <div class="glassmorphic-box1">
    <app-bargraph-component [analysisData]="analysisData()"></app-bargraph-component>
  </div>
  <div class="glassmorphic-box2">
    <app-piechart-component [analysisData]="analysisData()"></app-piechart-component>
  </div>
</div>

<!-- Risk summary box (unchanged style) -->
<div *ngIf="anlayze()" class="doc-summary">
  <div class="summary-row">
    <span class="summary-label">Document Score:</span>
    <span class="summary-value">{{documentScoreText}}</span>
  </div>
  <div class="summary-row">
    <span class="summary-label">Document Risk Type:</span>
    <span class="summary-value">{{analysisData().document_risk_level}}</span>
  </div>

  <!-- New: Document summary (generated by summarizer) -->
  <div class="summary-row" style="margin-top:12px; max-width:820px; text-align:left; flex-direction:column;">
    <div style="font-weight:700; color:#fff; margin-bottom:8px;">Document Summary</div>
    <div style="color:#f0f0f0; font-size:0.95rem; background: rgba(0,0,0,0.25); padding:12px; border-radius:8px;">
      <div *ngIf="contentSummary; else noSummary">{{contentSummary}}</div>
      <ng-template #noSummary><div style="opacity:.8">No summary available.</div></ng-template>
    </div>
  </div>

  <!-- New: total risky clauses -->
  <div class="summary-row" style="margin-top:12px;">
    <span class="summary-label">Total Risky Clauses:</span>
    <span class="summary-value">{{ totalRisky }}</span>
  </div>

  <!-- New: download clauses CSV (page+line) -->
  <button
    type="button"
    class="csv-download-btn"
    (click)="downloadClausesCsv()"
    style="margin-top:14px;"
  >
    ⬇️ Download Clauses CSV
  </button>
</div>
